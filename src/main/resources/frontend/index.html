<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Авторизация</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
  <div class="container">
    <img src="./images/alltime-logo.png" alt="Логотип" class="logo" width="100" height="29"/>
    <h1 id="auth-title">Вход в Договоры</h1>
    <div class="auth-tabs">
      <button class="auth-tab auth-tab-login auth-tab--active" type="button">Вход</button>
      <button class="auth-tab auth-tab-register" type="button">Регистрация</button>
    </div>
    <form id="login-form" class="form">
      <label for="login-input">Логин:</label>
      <input type="text" id="login-input" name="login" required />
      <label for="password-input">Пароль:</label>
      <input type="password" id="password-input" name="password" required />
      <button type="submit">Войти</button>
    </form>
    <form id="register-form" class="hidden form">
      <label for="register-login-input">Логин:</label>
      <input type="text" id="register-login-input" name="login" required />
      <label for="register-password-input">Пароль:</label>
      <input type="password" id="register-password-input" name="password" required />
      <label for="register-password-repeat-input">Повторите пароль:</label>  
      <input type="password" id="register-password-repeat-input" name="password-repeat" required />
      <button type="submit">Зарегистрироваться</button>
    </form>
    <p id="message"></p>
  </div>

  <script src="scripts/auth.js"></script>
  <script src="scripts/tabs.js"></script>
  <script src="scripts/register.js"></script>
</body>
</html>
