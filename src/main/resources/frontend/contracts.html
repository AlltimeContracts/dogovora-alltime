<!DOCTYPE html>
<html lang="en">

<head>
    <script src='scripts/check-auth.js'></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Договора</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body class="page-contracts">
    <header class="header">
        <nav class="header__links">
            <a class="header__logo" href="home.html">
                <img src="./images/alltime-logo.png" alt="Alltime" width="150" height="44">
            </a>
            <a class="header__link" href="contracts.html"><img src="./images/contracts-icon.png" alt="Договоры" width="40" height="40"><span class="header__link__text">Договоры</span></a>
            <a class="header__link" href="clients.html"><img src="./images/clients-icon.png" alt="Клиенты" width="40" height="40"><span class="header__link__text">Клиенты</span></a>
            <a class="header__link" href="users.html"><img src="./images/users-icon.png" alt="Пользователи" width="40" height="40"><span class="header__link__text">Пользователи</span></a>
            <a class="header__link" href="profile.html"><img src="./images/settings_icon.png" alt="Профиль" width="40" height="40"><span class="header__link__text">Профиль</span></a>
        </nav>
        <div class="header__buttons">
            <button class="header__notifications button header__link header__link--vertical" type="button"><img src="./images/notification-icon.png" alt="Уведомления" width="40" height="40"><span class="header__link__text">Уведомления</span></button>
            <button class="header__logout button header__link header__link--vertical" type="button" id="logout-button"><img src="./images/home-icon.png" alt="Выйти" width="40" height="40"><span class="header__link__text">Выйти</span></button>
        </div>
    </header>
    <h1 class="page-contracts__title">Договора</h1>
    <p id="contracts-error" class="error-message hidden"></p>
    <input class="page-contracts__search" type="search" id="search-input" placeholder="Поиск по названию...">
    <div id="loading-indicator" class="hidden">Загрузка данных...</div>
    <table class='table' id="contracts-table">
        <thead class='table__header'>
            <tr class="table__row">
                <th>ID</th>
                <th>Название</th>
                <th>Дата</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody class='table__body' id="contracts-table-body">
        </tbody>
    </table>
    <script src="scripts/contracts.js" type="module"></script>
</body>

</html>
