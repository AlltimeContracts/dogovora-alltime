services:
  postgres:
    image: postgres:18-alpine
    container_name: dogovora-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dogovora_db}
      POSTGRES_USER: ${POSTGRES_USER:-alltime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alltime}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alltime} -d ${POSTGRES_DB:-dogovora_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dogovora-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  dogovora-network:
    driver: bridge
